name: Metro build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: metro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure vcpkg
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          }
          "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV

      - name: Configure Windows build
        run: cmake --preset windows-msvc

      - name: Build Windows application
        run: cmake --build --preset windows-release --parallel 2

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build development image
        run: docker build -t metro-dev:ci -f Containerfile .

      - name: Configure
        run: >
          docker run --rm
          -v "$GITHUB_WORKSPACE:/work"
          -w /work
          metro-dev:ci
          cmake -S /work -B /work/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: >
          docker run --rm
          -v "$GITHUB_WORKSPACE:/work"
          -w /work
          metro-dev:ci
          cmake --build /work/build -j2

      - name: Simulation tests
        run: >
          docker run --rm
          -v "$GITHUB_WORKSPACE:/work"
          -w /work
          metro-dev:ci
          ctest --test-dir /work/build --output-on-failure
